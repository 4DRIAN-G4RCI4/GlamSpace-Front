# GlamSpaces · Front · Configuración de SonarQube Cloud
# Proyecto: https://sonarcloud.io/project/overview?id=4DRIAN-G4RCI4_GlamSpace-Front

sonar.projectKey=4DRIAN-G4RCI4_GlamSpace-Front
sonar.organization=4drian-g4rci4
sonar.projectName=GlamSpace-Front

# ---------- Qué se analiza ----------
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Fuera del análisis: dependencias, salida del build y archivos generados.
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  .expo/**,\
  package-lock.json

# Las pruebas (y los ayudantes que solo ellas usan) se analizan como pruebas.
sonar.tests=scripts/pruebas
sonar.test.inclusions=scripts/pruebas/**/*

# ---------- Cobertura ----------
# La genera `npm run test:cobertura` (node --test --experimental-test-coverage, reporter lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Capas que NO se miden con pruebas unitarias porque son presentación: componentes y pantallas
# de React Native Web, hojas de estilo, tokens del tema y el arranque de la app. No tienen reglas
# de negocio (esas viven en *.validaciones.js, *.logica.js, services/ y utils/, que sí se miden).
# Se verifican en el navegador real y su evidencia está en docs/evidencias-pwa/.
# Justificación escrita en el README, sección "Calidad y cobertura (SonarQube Cloud)".
sonar.coverage.exclusions=\
  App.js,\
  components/*.js,\
  screens/**/*Screen.js,\
  screens/**/*.styles.js,\
  components/**/*.styles.js,\
  screens/BusquedaSalones/BarraBusqueda.js,\
  screens/BusquedaSalones/FiltrosChips.js,\
  screens/BusquedaSalones/ResultadosSalones.js,\
  screens/DetalleSalon/CalendarioDisponibilidad.js,\
  screens/DetalleSalon/GaleriaDetalle.js,\
  screens/DetalleSalon/TarjetaReserva.js,\
  screens/PanelAdministrador/AccionesSolicitud.js,\
  screens/PanelAdministrador/BannerSinConexion.js,\
  screens/PanelAdministrador/CalendarioAdmin.js,\
  screens/PanelAdministrador/LayoutAdmin.js,\
  screens/PanelAdministrador/ListaSolicitudes.js,\
  screens/PublicarSalon/SeccionFotos.js,\
  screens/SolicitudReservacion/PasoConfirmar.js,\
  screens/SolicitudReservacion/PasoElegir.js,\
  screens/SolicitudReservacion/ResumenReserva.js,\
  **/use*.js,\
  theme/**,\
  scripts/sw.base.js,\
  scripts/cobertura.js
