# Pipeline de despliegue del front (PWA en Azure Storage).
#
#   1. pruebas    → pruebas unitarias con cobertura (las mismas de Sonar). Si falla una, no se despliega.
#   2. build      → export web de Expo + service worker, revisa que el build esté completo y lo
#                   comprime. Se guarda como artefacto: lo que se probó es exactamente lo que se sube.
#   3. deploy     → sube el artefacto a Azure Storage (entorno "produccion" de GitHub).
#   4. verificar  → prueba de humo en producción: el sitio responde, el service worker publicado es
#                   la versión recién construida y la API contesta /health.
#
# Corre al hacer push a main (cada release → main) o a mano desde Actions. Un solo deploy a la vez.

name: Deploy Frontend to Azure Storage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-front-produccion
  cancel-in-progress: false

env:
  SITIO: https://glamspacesfrontsa.z41.web.core.windows.net
  API_SALUD: https://glamspaces-api-g8g9bzemfyh7g3en.mexicocentral-01.azurewebsites.net/health

jobs:
  pruebas:
    name: 1 · Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: el medidor de cobertura de `node --test` necesita 22 o más.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Pruebas con cobertura
        run: npm run test:cobertura

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore

  build:
    name: 2 · Build de producción
    needs: pruebas
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Export web (Expo) + service worker (HU-21)
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      # Un build incompleto no se sube: deben existir la página, el service worker, el manifest,
      # el arranque del tema y el bundle de la app.
      - name: Revisar que el build esté completo
        run: |
          for f in index.html sw.js manifest.json tema.js; do
            test -s "dist/$f" || { echo "::error::Falta dist/$f"; exit 1; }
          done
          ls dist/_expo/static/js/web/*.js > /dev/null || { echo "::error::Falta el bundle de la app"; exit 1; }
          grep -q 'id="root"' dist/index.html || { echo "::error::index.html sin #root"; exit 1; }

      - name: Versión del service worker
        id: version
        run: echo "version=$(sed -n 's/^var VERSION = "\(.*\)";$/\1/p' dist/sw.js)" >> "$GITHUB_OUTPUT"

      # HU-28 · Rendimiento. Azure Storage no comprime ni pone caché por su cuenta: los textos se
      # suben ya en gzip (el bundle baja de ~740 KB a ~205 KB) con Content-Encoding: gzip.
      - name: Comprimir con gzip el bundle y los archivos de texto de la raíz
        run: |
          for f in $(find dist/_expo -type f \( -name '*.js' -o -name '*.css' \)) dist/index.html dist/sw.js dist/tema.js dist/manifest.json dist/metadata.json; do
            gzip -9 -n -c "$f" > "$f.gz" && mv "$f.gz" "$f"
          done

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: 3 · Deploy a Azure Storage
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://glamspacesfrontsa.z41.web.core.windows.net
    steps:
      - name: Descargar el build probado
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Caché: _expo/ y assets/ llevan hash en el nombre (si cambian, cambia el nombre) → 1 año e
      # inmutables. icons/ → 7 días. index.html, sw.js, tema.js y los .json → no-cache, para que cada
      # deploy se vea al momento y el aviso de nueva versión (HU-21) siga funcionando. index.html va al final.
      - name: Subir a Azure Storage (sitio estático)
        uses: azure/CLI@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2
        with:
          inlineScript: |
            CONN="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"
            az storage blob upload-batch --account-name glamspacesfrontsa --destination '$web' --source ./dist \
              --pattern '_expo/*' --overwrite --connection-string "$CONN" \
              --content-encoding gzip --content-cache-control 'public, max-age=31536000, immutable'
            az storage blob upload-batch --account-name glamspacesfrontsa --destination '$web' --source ./dist \
              --pattern 'assets/*' --overwrite --connection-string "$CONN" \
              --content-cache-control 'public, max-age=31536000, immutable'
            az storage blob upload-batch --account-name glamspacesfrontsa --destination '$web' --source ./dist \
              --pattern 'icons/*' --overwrite --connection-string "$CONN" \
              --content-cache-control 'public, max-age=604800'
            for f in manifest.json metadata.json tema.js sw.js index.html; do
              case "$f" in
                *.json) tipo='application/json' ;;
                *.js)   tipo='application/javascript' ;;
                *)      tipo='text/html; charset=utf-8' ;;
              esac
              az storage blob upload --account-name glamspacesfrontsa --container-name '$web' --file "dist/$f" --name "$f" \
                --overwrite --connection-string "$CONN" --content-type "$tipo" \
                --content-encoding gzip --content-cache-control 'no-cache'
            done

  verificar:
    name: 4 · Prueba de humo en producción
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      # Solo lecturas (GET): no escribe nada en producción. Reintenta unos segundos por si el
      # almacenamiento tarda en servir lo recién subido.
      - name: El sitio responde y sirve la versión nueva
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for intento in 1 2 3 4 5 6; do
            # "|| true": con bash -e, un curl que falla o se agota no debe cortar los reintentos.
            pagina=$(curl -s -m 20 --compressed -o /dev/null -w '%{http_code}' "$SITIO/" || true)
            sw=$(curl -s -m 20 --compressed "$SITIO/sw.js" | sed -n 's/^var VERSION = "\(.*\)";$/\1/p')
            echo "Intento $intento · página $pagina · service worker $sw (esperado $VERSION)"
            if [ "$pagina" = "200" ] && [ "$sw" = "$VERSION" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Producción no sirve la versión $VERSION"
          exit 1

      # Si falta un solo archivo del precache, el service worker no se instala y la app deja de
      # funcionar sin conexión: se revisa que TODOS respondan 200.
      - name: Todo lo que guarda el service worker está publicado
        run: |
          curl -s --compressed "$SITIO/sw.js" | sed -n '/^var PRECACHE = \[/,/^\];/p' | grep -o '"/[^"]*"' | tr -d '"' > precache.txt
          echo "$(wc -l < precache.txt) archivos en el precache"
          [ -s precache.txt ] || { echo "::error::No se pudo leer el precache de sw.js"; exit 1; }
          fallas=0
          while read -r ruta; do
            codigo=$(curl -s -m 20 --compressed -o /dev/null -w '%{http_code}' "$SITIO$ruta" || true)
            echo "$ruta → $codigo"
            [ "$codigo" = "200" ] || { echo "::error::$ruta respondió $codigo"; fallas=$((fallas + 1)); }
          done < precache.txt
          [ "$fallas" -eq 0 ]

      - name: La API que usa el front está sana
        run: |
          for intento in 1 2 3 4 5 6; do
            codigo=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$API_SALUD" || true)
            echo "Intento $intento · /health → $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::La API no responde /health"
          exit 1
